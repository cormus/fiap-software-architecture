apiVersion: apps/v1
kind: Deployment
metadata:
  name: minha-app-spring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minha-app-spring
  template:
    metadata:
      labels:
        app: minha-app-spring
    spec:
      containers:
      - name: minha-app-spring
        image: cormus/fiap-software-architecture:0.0.1
        imagePullPolicy: Never # Alterado para Never para utilizar a imagem local
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "1000m"
        env:
          #name: SPRING_PROFILES_ACTIVE
          #value: "prod" # Definir perfil Spring Boot se necessário
          - name: SPRING_DATASOURCE_URL #"jdbc:mysql://mysql:3306/pedido_db"
            valueFrom:
              configMapKeyRef:
                name: mysql-configmap
                key: DATABASE_URL
          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: DATABASE_USER
          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: mysql-secret
                key: DATABASE_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: minha-app-spring-service
spec:
  type: NodePort
  selector:
    app: minha-app-spring
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080  # Porta acessível no host